<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* MAIN SECTION */

.contact-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 16px 60px;
}

.contact-card{
  width:100%;
  max-width:420px;
  background:#ffffff;
  border-radius:22px;
  padding:32px 24px;
  text-align:center;
  border:1px solid #dbe3f3;
  box-shadow:
    0 0 0 4px #eef3ff,
    0 15px 35px rgba(37,99,235,0.10),
    0 5px 15px rgba(0,0,0,0.06);
}

/* ICON */

.contact-icon{
  width:56px;
  height:56px;
  margin:0 auto 20px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#e0e7ff,#c7d2fe);
  font-size:26px;
}

/* TITLE */

.contact-title{
  font-size:26px;
  line-height:1.3;
  font-weight:800;
  margin-bottom:14px;
}

.contact-title span{
  background:linear-gradient(to right,#2563eb,#02278d);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TEXT */

.contact-sub{
  font-size:14px;
  line-height:1.7;
  color:#4b5563;
  margin-bottom:28px;
}

/* BUTTON */

.contact-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-decoration:none;
  color:white;
  padding:15px;
  border-radius:14px;
  font-size:15px;
  font-weight:700;

  background:linear-gradient(
    180deg,
    #4d8bff 0%,
    #1e54ff 50%,
    #0f3cdc 100%
  );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.4),
    0 8px 20px rgba(37,99,235,0.30);

  transition:0.25s ease;
}

.contact-btn:hover{
  transform:translateY(-2px);
}

/* EMAIL */

.contact-email{
  margin-top:18px;
  font-size:13px;
}

.contact-email a{
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
  border-bottom:1px solid rgba(37,99,235,0.3);
}

/* FOOTER */

.footer{
  background:linear-gradient(135deg,#2a0a4a,#4c1d95);
  color:white;
  text-align:center;

  padding:55px 20px 35px;

  border-top-left-radius:34px;
  border-top-right-radius:34px;
}

.footer-logo{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:16px;
}

.footer-brand{
  font-size:18px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:12px;
}

.footer-rating{
  font-size:13px;
  color:rgba(255,255,255,0.9);
  margin-bottom:24px;
}

.footer-divider{
  width:100%;
  max-width:480px;
  height:1px;
  background:rgba(255,255,255,0.15);
  margin:0 auto 24px;
}

.footer-links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:16px;
}

.footer-links a{
  color:rgba(255,255,255,0.75);
  text-decoration:none;
  font-size:13px;
}

.footer-copy{
  font-size:11px;
  color:#d8c4ff;
}

/* MOBILE */

@media(max-width:480px){

  .contact-wrap{
    padding:30px 14px 50px;
  }

  .contact-card{
    padding:28px 20px;
    border-radius:18px;
  }

  .contact-title{
    font-size:22px;
  }

  .footer{
    padding:45px 18px 30px;
    border-top-left-radius:28px;
    border-top-right-radius:28px;
  }

}

</style>
</head>

<body>

<!-- CONTACT -->

<section class="contact-wrap">

  <div class="contact-card">

    <div class="contact-icon">
      📩
    </div>

    <h1 class="contact-title">
      Need Help?
      <span>Contact Us</span>
    </h1>

    <p class="contact-sub">
      Stuck somewhere? 
      <br>
      Our team is here to help you.
      <br>
      Drop us a message — we reply fast.
    </p>

    <a
      class="contact-btn"
      href="https://mail.google.com/mail/?view=cm&fs=1&to=moneyhustlers.co@gmail.com"
      target="_blank"
    >
      Email Us →
    </a>

    <p class="contact-email">
      <a href="mailto:moneyhustlers.co@gmail.com">
        moneyhustlers.co@gmail.com
      </a>
    </p>

  </div>

</section>

<!-- FOOTER -->

<footer class="footer">

  <a href="index.html" style="text-decoration:none;color:white;">

    <img
      src="m.png"
      alt="Money Hustle Logo"
      class="footer-logo"
    >

    <div class="footer-brand">
      MONEY HUSTLE
    </div>

  </a>

  <div class="footer-rating">
    ⭐ Rated 4.8/5 by Users
  </div>

  <div class="footer-divider"></div>

  <div class="footer-links">
    <a href="terms.html">Terms</a>
    <span>·</span>

    <a href="privacy.html">Privacy</a>
    <span>·</span>

    <a href="contact.html">Contact Us</a>
  </div>

  <div class="footer-copy">
    © 2026 Money Hustle. All rights reserved.
  </div>

</footer>

</body>
</html>
